# Notes for developers / cluster users:
# - On Compute Canada: DO NOT pip-install OpenCV. Use the module instead:
#     module load StdEnv/2023
#     module load opencv/4.8.0
# - If you need to install Python deps manually:
#     python3 -m pip install --upgrade scikit-image
#     python3 -m pip install --upgrade biopython
# - Optional (local machines only, NOT on CC):
#     python3 -m pip install --upgrade opencv-python

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extprime"
version = "0.1.0"
description = "Extremophile analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]

dependencies = [
  "numpy~=1.25",
  "scipy~=1.11",
  "pandas~=2.1",
  "matplotlib~=3.7",
  # image stack
  "Pillow~=10.1",
  "scikit-image~=0.22",
  # bio
  "biopython~=1.81",
  # sklearn
  "scikit-learn~=1.3",
  "scikit-learn-extra~=0.3",
  # misc transitive pins
  "contourpy~=1.2",
  "kiwisolver~=1.4",
  "cycler~=0.12",
  "fonttools~=4.49",
  "pyparsing~=3.0",
  "packaging~=23.2",
  "Jinja2~=3.1",
  "MarkupSafe~=2.1",
  "joblib~=1.3",
  "threadpoolctl~=3.3",
  "networkx~=3.2",
  "sympy~=1.12",
  "mpmath~=1.3",
  "python-dateutil>=2.9.0.post0",
  "pytz>=2024.1",
  "tzdata>=2024.1",
  "typing_extensions~=4.10",
  "six~=1.16"
]

# Optional feature sets:
# - pytorch: installs torch/torchvision + lpips (install using the right CPU/CUDA index-url)
# - vamb: installs VAMB (depends on torch; usually install together with [pytorch])
# - opencv-local: for laptops/desktops only; on Compute Canada use `module load opencv`
[project.optional-dependencies]
pytorch = [
  "torch",
  "torchvision",
  "lpips"
]
vamb = [
  "vamb"
]
opencv-local = [
  "opencv-python"
  # or: "opencv-contrib-python"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
extprime = ["**/*.txt", "**/*.csv", "**/*.json", "**/*.yaml", "**/*.yml"]

[project.scripts]
extprime-cli = "extprime.cli:main"
