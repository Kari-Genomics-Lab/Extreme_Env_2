[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extprime"
version = "0.1.0"
description = "Extremophile analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]

# Use normal PyPI names here (no +computecanada local tags).
# Pin with compatible releases so both PyPI and CC wheelhouse resolve cleanly.
dependencies = [
  "numpy~=1.25",
  "scipy~=1.11",
  "pandas~=2.1",
  "matplotlib~=3.7",
  "contourpy~=1.2",
  "kiwisolver~=1.4",
  "cycler~=0.12",
  "fonttools~=4.49",
  "Pillow~=10.1",
  "pyparsing~=3.0",
  "packaging~=23.2",
  "Jinja2~=3.1",
  "MarkupSafe~=2.1",
  "joblib~=1.3",
  "threadpoolctl~=3.3",
  "networkx~=3.2",
  "sympy~=1.12",
  "mpmath~=1.3",
  "python-dateutil>=2.9.0.post0",
  "pytz>=2024.1",
  "tzdata>=2024.1",
  "typing_extensions~=4.10",
  "six~=1.16",
  "scikit-learn~=1.3",
  "scikit-learn-extra~=0.3"
]

# Torch is special on Compute Canada—install it separately (see notes below).
optional-dependencies = { pytorch = ["torch", "torchvision"] }

[tool.setuptools.packages.find]
where = ["src"]

# If you have non-Python data inside the package, list globs here:
[tool.setuptools.package-data]
extprime = ["**/*.txt", "**/*.csv", "**/*.json", "**/*.yaml", "**/*.yml"]

# (Optional) command-line entry points
[project.scripts]
extprime-cli = "extprime.cli:main"
